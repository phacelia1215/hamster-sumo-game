<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-HEAD-->
<title>ハムスター大相撲！ころりん場所</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 土俵(3D)を左、番付と稽古の帳面を右に置く二面構成。狭い画面では土俵が上。 */
:root {
  --bg: #f3eff9;
  --surface: #ffffff;
  --surface-2: #ebe5f5;
  --ink: #2a2140;
  --muted: #6a6182;
  --line: #d9d0ea;
  --murasaki: #5b3a9e;
  --on-murasaki: #ffffff;
  --aka: #cf3f36;
  --kin: #b9861a;
  --stage-top: #e3d8f6;
  --stage-bot: #fbf1dc;
  --shadow: 0 2px 0 rgba(42, 33, 64, .08);
  --font-display: "Dela Gothic One", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18132a; --surface: #241c3a; --surface-2: #2e2548; --ink: #f2edfb; --muted: #aaa1c4;
    --line: #3c3259; --murasaki: #b89df6; --on-murasaki: #1c1433; --aka: #ff7b70; --kin: #e9bd55;
    --stage-top: #31265a; --stage-bot: #1a1326; --shadow: 0 2px 0 rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18132a; --surface: #241c3a; --surface-2: #2e2548; --ink: #f2edfb; --muted: #aaa1c4;
  --line: #3c3259; --murasaki: #b89df6; --on-murasaki: #1c1433; --aka: #ff7b70; --kin: #e9bd55;
  --stage-top: #31265a; --stage-bot: #1a1326; --shadow: 0 2px 0 rgba(0, 0, 0, .3);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6; font-weight: 500;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--murasaki); outline-offset: 2px; }

.app {
  max-width: 1120px; margin: 0 auto; padding-block: 14px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
.mast { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; }
.mast h1 { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-family: var(--font-display); font-weight: 400; line-height: 1.15; }
.mast .t1 { font-size: clamp(20px, 4.6vw, 30px); letter-spacing: .02em; }
.mast .t2 { font-size: clamp(14px, 3vw, 18px); background: var(--murasaki); color: var(--on-murasaki); padding: 3px 12px 4px; border-radius: 4px; }
.mast-info { font-weight: 700; color: var(--muted); font-size: 14px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
@media (min-width: 880px) {
  .layout .stage { aspect-ratio: 4 / 3; }
  .layout { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
}

/* ---------- 土俵 ---------- */
.stage {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 5; box-shadow: 0 -12px 0 var(--bg), 0 8px 0 var(--bg);
  width: 100%; max-width: 100%; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden;
  background: linear-gradient(var(--stage-top), var(--stage-bot)); border: 2px solid var(--ink);
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
.stage-tag {
  position: absolute; top: 10px; left: 10px; background: var(--surface); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 6px; padding: 1px 10px; font-weight: 700; font-size: 13px;
}
.stage-say {
  position: absolute; left: 8px; right: 8px; bottom: 8px; text-align: center; pointer-events: none;
  font-weight: 900; font-size: clamp(15px, 3.4vw, 19px); line-height: 1.4; color: var(--ink);
}
.stage-say span {
  display: inline-block; max-width: 100%; background: var(--surface); border: 2px solid var(--ink); border-radius: 12px;
  padding: 3px 12px; box-shadow: 0 2px 0 var(--ink); animation: pop .25s ease-out;
}
.stage-big {
  position: absolute; inset: 12% 0 auto; text-align: center; pointer-events: none;
  font-family: var(--font-display); color: var(--ink);
  text-shadow: 0 0 10px var(--surface), 0 0 10px var(--surface), 0 0 3px var(--surface);
}
.stage-big .k { font-size: clamp(30px, 8vw, 60px); line-height: 1.1; animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
.stage-big .s { font-size: clamp(15px, 3vw, 20px); font-family: var(--font-body); font-weight: 900; }
.stage-big.win .k { color: var(--aka); }
.toast {
  position: absolute; top: 14%; left: 50%; transform: translateX(-50%); width: max-content; max-width: 92%; text-align: center; pointer-events: none;
  background: var(--ink); color: var(--bg); border-radius: 999px; padding: 4px 16px; font-weight: 900;
  animation: rise 1.9s ease-out forwards;
}
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes rise { 0% { opacity: 0; margin-top: 16px; } 15% { opacity: 1; margin-top: 0; } 80% { opacity: 1; } 100% { opacity: 0; margin-top: -14px; } }
@media (prefers-reduced-motion: reduce) { .stage-big .k, .toast { animation-duration: .01s; } }

/* ---------- 帳面 ---------- */
.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 18px; text-wrap: balance; }
.card p { margin: 0; }
.sub { color: var(--muted); font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.between { justify-content: space-between; }

.btn {
  border: 2px solid var(--ink); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 900;
  box-shadow: 0 3px 0 var(--ink); transition: transform .08s, box-shadow .08s;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--murasaki); color: var(--on-murasaki); }
.btn.wide { width: 100%; font-size: 17px; padding-block: 12px; }
.btn.small { padding: 4px 12px; font-size: 13px; box-shadow: 0 2px 0 var(--ink); }
.linkbtn { background: none; border: 0; padding: 4px; color: var(--muted); text-decoration: underline; font-size: 13px; }

/* ハムスター選択 */
.kinds { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.kind { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; }
.kind[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); box-shadow: 0 3px 0 var(--ink); }
.kind b { font-weight: 900; display: flex; align-items: center; gap: 6px; }
.kind .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
.kind span { font-size: 12px; color: var(--muted); line-height: 1.4; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-weight: 900; font-size: 13px; }
.field input { border: 2px solid var(--ink); border-radius: 8px; padding: 8px 10px; background: var(--surface); min-width: 0; flex: 1; font-weight: 700; font-size: 16px; }

/* 力士カード */
.rank { font-size: 13px; font-weight: 900; color: var(--murasaki); }
.shikona { font-family: var(--font-display); font-size: 24px; line-height: 1.2; overflow-wrap: anywhere; }
.rec { font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
.stars { letter-spacing: .12em; font-size: 15px; }
.stars .w { color: var(--aka); }
.meter { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 2.4em; align-items: center; gap: 8px; font-weight: 900; font-variant-numeric: tabular-nums; }
.meter .bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 99px; background: var(--murasaki); transition: width .4s; }
.meter.energy .bar i { background: var(--kin); }
.meter .n { text-align: right; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 16px; }

.tabs { display: flex; gap: 6px; }
.tab { flex: 1; min-height: 44px; border: 2px solid var(--ink); background: var(--surface); border-radius: 10px 10px 0 0; padding: 6px 4px; font-weight: 900; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.trains { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.train { text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 8px; min-height: 64px; min-width: 0; }
.train b { overflow-wrap: anywhere; line-height: 1.25; }
@media (max-width: 879px) { .train b { font-size: 14px; } .train span { font-size: 11px; } }
.train b { font-size: 15px; }
.train span { font-size: 12px; font-weight: 700; color: var(--muted); }
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; text-align: center; }
.vs .n { font-family: var(--font-display); font-size: 17px; overflow-wrap: anywhere; line-height: 1.25; }
.vs .mid { font-family: var(--font-display); color: var(--muted); }

/* 番付表: 本物と同じく東が右 */
.banzuke { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; font-variant-numeric: tabular-nums; }
.banzuke > div { padding: 4px 8px; border-bottom: 1px solid var(--line); min-width: 0; display: flex; align-items: center; gap: 6px; }
.banzuke .hd { background: var(--ink); color: var(--bg); font-weight: 900; justify-content: center; font-size: 13px; }
.banzuke .rk { justify-content: center; font-weight: 900; font-size: 12px; background: var(--surface-2); white-space: nowrap; border-inline: 1px solid var(--line); }
.banzuke .rk.top { font-family: var(--font-display); font-size: 14px; font-weight: 400; }
.banzuke .cell { justify-content: space-between; }
.banzuke .cell .nm { font-weight: 700; overflow-wrap: anywhere; line-height: 1.3; }
.banzuke .cell .wl { font-size: 12px; color: var(--muted); white-space: nowrap; }
.banzuke .cell.me { background: var(--murasaki); }
.banzuke .cell.me .nm, .banzuke .cell.me .wl { color: var(--on-murasaki); font-weight: 900; }
.banzuke .up { color: var(--aka); font-weight: 900; }
.banzuke .down { color: var(--muted); font-weight: 900; }
.banzuke .cell.me .up, .banzuke .cell.me .down { color: var(--on-murasaki); }
.banzuke .div { grid-column: 1 / -1; background: var(--surface-2); font-size: 12px; font-weight: 900; color: var(--muted); justify-content: center; padding-block: 2px; }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }
.log li { padding: 2px 0; border-bottom: 1px dashed var(--line); }
.log li.g { font-weight: 900; color: var(--murasaki); }
.verdict { font-family: var(--font-display); font-size: 32px; line-height: 1.1; }
.verdict.win { color: var(--aka); }
.news { display: flex; flex-direction: column; gap: 6px; }
.news div { border-left: 0; background: var(--surface-2); border-radius: 8px; padding: 6px 12px; font-weight: 900; }
.news div.gold { background: var(--kin); color: var(--surface); }
/* 着せ替え */
.purse { font-weight: 900; color: var(--kin); white-space: nowrap; font-variant-numeric: tabular-nums; }
.cats { display: flex; flex-wrap: wrap; gap: 6px; }
.cat { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-weight: 900; font-size: 13px; }
.cat[aria-selected="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 6px; border: 2px solid var(--line); background: var(--surface); border-radius: 10px; text-align: center; min-width: 0; }
.item b { font-size: 13px; line-height: 1.3; }
.item .st { font-size: 11px; font-weight: 900; color: var(--muted); }
.item .st.on { color: var(--murasaki); }
.item .st.price { color: var(--kin); }
.item[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); box-shadow: 0 3px 0 var(--ink); }
.item.locked { opacity: .6; }
.sw { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--ink); background-size: cover; background-position: center; display: grid; place-items: center; font-weight: 900; font-size: 13px; }
.sw.belt { border-radius: 6px; height: 22px; margin-block: 11px; width: 52px; }
.sw.apron { border-radius: 4px; width: 58px; height: 44px; }
.sw.empty { border-style: dashed; background: transparent; }
.tryon { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.tryon .acts { display: flex; gap: 8px; margin-left: auto; }
/* 力士カード（コンパクト） */
.who { display: flex; flex-direction: column; gap: 8px; }
.who-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.stat5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.st5 { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--surface-2); border-radius: 8px; padding: 4px 2px 6px; font-variant-numeric: tabular-nums; }
.st5 span { font-size: 12px; font-weight: 900; color: var(--muted); }
.st5 b { font-size: 17px; line-height: 1.1; }
.st5 i { display: block; width: 80%; height: 4px; border-radius: 9px; background: var(--line); overflow: hidden; }
.st5 i u { display: block; height: 100%; background: var(--murasaki); text-decoration: none; }
/* 画面下のアクション */
.dock {
  position: sticky; bottom: 0; z-index: 6; display: flex; flex-direction: column; gap: 6px;
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); margin-top: -4px;
  background: linear-gradient(to bottom, transparent, var(--bg) 22%);
}
.dock-vs { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 2px 8px; font-weight: 900; font-size: 14px; text-align: center; }
.dock-vs .sub { font-weight: 700; }
/* 進行スピード */
.speed { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.speed .lbl { font-size: 13px; font-weight: 900; color: var(--muted); }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 0 12px; min-height: 40px; font-weight: 900; font-size: 14px; }
.seg button + button { border-left: 2px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.match-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.log { font-size: 15px; }
@media (max-width: 879px) {
  .app { gap: 10px; padding-block: 8px 0; }
  .mast .t1 { font-size: 20px; } .mast .t2 { font-size: 14px; } .mast-info { font-size: 12px; }
  .card { padding: 12px; border-radius: 10px; }
  .panel { gap: 10px; }
  .shikona { font-size: 21px; }
  .log { max-height: 34vh; }
}
.foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 12px; }
</style>
<!--/ARTIFACT-HEAD-->
</head>
<body>
<!--ARTIFACT-BODY-->
<div class="app">
  <header class="mast">
    <h1><span class="t1">ハムスター大相撲！</span><span class="t2">ころりん場所</span></h1>
    <div class="mast-info" id="mastInfo"></div>
  </header>
  <main class="layout">
    <section class="stage" id="stage" aria-label="土俵">
      <canvas id="cv"></canvas>
      <div class="stage-tag" id="stageTag" hidden></div>
      <div class="stage-big" id="stageBig" hidden></div>
      <div class="stage-say" id="stageSay" aria-live="polite"></div>
    </section>
    <section class="panel" id="panel" aria-label="帳面"></section>
  </main>
  <footer class="foot">
    <span>セーブはこのブラウザに自動で保存されます。</span>
    <span id="resetBox"></span>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  for (let i = 0; i < 10; i++) {
    let dx;
    if (Math.random() < .3) {
      const by = Math.random() < .5 ? 0 : 1, a = S[by], d = S[1 - by], dir = by === 0 ? 1 : -1;
      const pa = a.tec * rnd(.4, 1.6) + a.spd * .3, pd = d.tec * rnd(.4, 1.6) + d.body * .3;
      if (pa > pd * 1.7) { const type = Math.random() < .5 ? 'throw' : 'slap'; return finish(by, type, pick(type === 'throw' ? THROWS : SLAPS)); }
      if (pa > pd) { dx = dir * .22; x += dx; ev.push({ t: 'waza', by, x: clamp(x, -1, 1) }); }
      else { dx = -dir * .12; x += dx; ev.push({ t: 'miss', by, x: clamp(x, -1, 1) }); }
    } else {
      const fa = (A.pow * .65 + A.body * .35) * rnd(.15, 1.85), fb = (B.pow * .65 + B.body * .35) * rnd(.15, 1.85);
      dx = clamp((fa - fb) / (fa + fb) * 1.6, -.5, .5); x += dx;
      ev.push({ t: 'push', x: clamp(x, -1, 1), dx });
    }
    if (Math.abs(x) >= 1) {
      const w = x > 0 ? 0 : 1, l = 1 - w;
      if (!neb[l] && Math.random() < S[l].guts / (S[l].guts + S[w].guts) * .55) {
        neb[l] = true;
        if (Math.random() < .2) { ev.push({ t: 'nebari', by: l, x: Math.sign(x) * .98 }); return finish(l, 'utchari', 'うっちゃり'); }
        x = Math.sign(x) * .55; ev.push({ t: 'nebari', by: l, x }); continue;
      }
      return finish(w, 'out', Math.abs(dx) > .3 ? pick(['押し出し', '突き出し']) : '寄り切り');
    }

}

  const H = three.makeHamster(look);
  three.actors.push(H); three.solo = H; three.setCam('home');
}
function showHome() { showSolo(lookOf(me(), ui.preview ? { [ui.preview.cat]: ui.preview.id } : null), 'home'); }
function playTraining(id, great) { if (!three || !three.solo) return 300; return Math.round(three.startTraining(id, great) * 1000 / three.speed) || 300; }
function toast(text) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = text; stageEl.appendChild(d); setTimeout(() => d.remove(), 2000); }
function sayLine(text) { sayEl.innerHTML = `<span>${esc(text)}</span>`; logLine(text); }
const speedV = () => SPEEDS.find(x => x.id === ui.speed).v;
function setSpeed(id) { ui.speed = id; try { localStorage.setItem('hamsumo.speed', id); } catch (e) { /* noop */ } if (three) three.speed = speedV(); }
const speedHtml = () => `<div class="speed"><span class="lbl">進行スピード</span><div class="seg">${SPEEDS.map(x => `<button data-speed="${x.id}" aria-pressed="${x.id === ui.speed}">${x.label}</button>`).join('')}</div></div>`;
function bindSpeed() { panel.querySelectorAll('[data-speed]').forEach(b => { b.onclick = () => { setSpeed(b.dataset.speed); panel.querySelectorAll('[data-speed]').forEach(x => x.setAttribute('aria-pressed', x.dataset.speed === ui.speed)); }; }); }
let logEl = null;
function logLine(text, cls) { if (!logEl) return; const li = document.createElement('li'); li.textContent = text; if (cls) li.className = cls; logEl.appendChild(li); logEl.scrollTop = logEl.scrollHeight; }

async function animateBout(res, m, opp) {
  if (!three) return;
  const PI = Math.PI, east = posOf(m) % 2 === 0, s = east ? 1 : -1; // 東は正面から見て左
  three.clear(); three.mode = 'match'; three.skip = false;
  let said = 0; const say = t => { sayLine(t); said++; };
  const A = three.makeHamster(lookOf(m)), B = three.makeHamster(lookOf(opp)), G = three.makeGyoji();
  three.actors.push(A, B, G);
  const H = [A, B], names = [m.name, opp.name], X = RING - 1.0, d = .84, start = 1.7, entry = 4.4;
  const tiers = [rankInfo(posOf(m)).tier, rankInfo(posOf(opp)).tier];
  const { tween, wait, spawn, say3d, dustRing, starBurst, sweat, camTo } = three;
  const fx = (fn) => { if (!three.skip) fn(); };
  A.root.rotation.y = s * PI / 2; B.root.rotation.y = -s * PI / 2;
  A.root.position.set(-s * entry, 0, 0); B.root.position.set(s * entry, 0, 0);
  G.root.position.set(0, 0, -2.5);
  let cur = 0;
  const place = x => { const cx = s * x * X; A.root.position.x = cx - s * d; B.root.position.x = cx + s * d; };
  const moveTo = (x, dur) => { const from = cur; cur = x; return tween(dur, k => place(lerp(from, x, ease(k)))); };
  const follow = (zoom = 1) => {
    three.follow = dt => {
      const cx = clamp((A.root.position.x + B.root.position.x) / 2, -2.6, 2.6);
      three.cam.tl.set(cx, 1.05, 0); three.cam.tp.set(cx * .75, 3.4 * zoom, 10.5 * zoom);
      G.root.position.x += (cx * .6 - G.root.position.x) * Math.min(1, dt * 3);
    };
  };
  const gyoji = (anim, text) => { G.anim = anim; G.t = 0; if (text) fx(() => say3d(text, G.root.position.x, 2.7, -2.3, '#2c8c9c')); };
  const feetDust = (h, dir) => fx(() => spawn('dust', h.root.position.x - dir * .3, .15, (Math.random() - .5) * .6, { v: [-dir * .7, .3, 0], life: .6, size: .34, grow: 1.4, fade: .2 }));

  // 呼び上げと入場
  camTo([0, 5.2, 13.5], [0, 1, 0]); three.cam.pos.set(0, 6, 15);
  const [eName, wName] = east ? [m.name, opp.name] : [opp.name, m.name];
  say(`ひが〜し〜、${eName}〜。`); await wait(.9);
  say(`に〜し〜、${wName}〜。`);
  A.anim = B.anim = 'walk';
  await tween(1.1, k => { A.root.position.x = -s * lerp(entry, 2.7, ease(k)); B.root.position.x = s * lerp(entry, 2.7, ease(k)); });
  // 塩まき
  A.anim = B.anim = 'salt'; A.t = B.t = 0;
  await wait(.4);
  fx(() => { for (const [h, dir] of [[A, s], [B, -s]]) for (let i = 0; i < 14; i++) spawn('salt', h.root.position.x + dir * .4, 2.0, 0, { v: [dir * (1.2 + Math.random() * 1.6), 1.6 + Math.random() * 1.4, (Math.random() - .5) * 1.6], g: 6, life: .8, size: .07 + Math.random() * .06, fade: .5 }); say3d('パーッ', 0, 3.1, 0, '#6a6182'); });
  await wait(.6);
  // 四股
  camTo([0, 3.3, 10.5], [0, 1.1, 0]);
  A.anim = B.anim = 'shiko'; A.t = B.t = 0;
  await wait(1.22);
  fx(() => { dustRing(A.root.position.x, 0, 6, .8); dustRing(B.root.position.x, 0, 6, .8); say3d('ドスン!', 0, 2.9, 0, '#cf3f36'); });
  three.shake = .18;
  await wait(.5);
  // 仕切り・睨み合い
  A.anim = B.anim = 'walk';
  await tween(.45, k => { A.root.position.x = -s * lerp(2.7, start, k); B.root.position.x = s * lerp(2.7, start, k); });
  A.anim = B.anim = 'shikiri'; gyoji('gyojiCall', '見合って!');
  say('見合って、見合って…');
  camTo([0, 1.8, 8.0], [0, 1.0, 0]);
  await wait(.5);
  fx(() => spawn('txt:バチバチ:#b9861a', 0, 1.9, .3, { life: 1, size: .55, pop: true, fade: .7 }));
  await tween(.9, k => { three.cam.tp.set(0, 1.7, 8.0 - k * .8); });
  // 立合い
  say('はっけよい！'); gyoji('gyojiNokotta', 'はっけよい!');
  A.setKesho(false); B.setKesho(false); A.anim = B.anim = 'push';
  await tween(.16, k => { A.root.position.x = -s * lerp(start, d, k * k); B.root.position.x = s * lerp(start, d, k * k); });
  three.shake = .35;
  fx(() => { spawn('ring', 0, 1.2, .2, { life: .35, size: .6, grow: 2.4, fade: .1 }); say3d('ドンッ!!', 0, 2.8, .3, '#cf3f36'); dustRing(-.8, 0, 5, .8); dustRing(.8, 0, 5, .8); });
  follow(.9);
  let nok = 0;
  for (const e of res.events) {
    said = 0;
    if (e.t === 'tachiai') { await moveTo(e.x, .5); if (Math.abs(e.x) > .15) { const w = e.x > 0 ? 0 : 1; say(`${names[w]}、するどい立合い！`); fx(() => say3d('速い!', H[w].root.position.x, 2.5, .3, '#1f5fa8')); } }
    else if (e.t === 'push') {
      const w = e.dx > 0 ? 0 : 1, dir = w === 0 ? s : -s;
      if (Math.abs(e.dx) > .25) { say(`${names[w]}、一気に前へ！`); fx(() => say3d('ぐいっ!', H[w].root.position.x, 2.5, .3)); }
      else if (nok++ % 2 === 0) { say('のこった、のこった！'); gyoji('gyojiNokotta', 'のこった!'); }
      feetDust(H[1 - w], -dir);
      if (Math.random() < .35) fx(() => sweat(H[Math.random() < .5 ? 0 : 1].root.position.x, 2.0, .2));
      await moveTo(e.x, .62); feetDust(H[1 - w], -dir);
    }
    else if (e.t === 'waza') {
      say(`${names[e.by]}、いなして体を入れかえる！`); fx(() => say3d('いなし!', H[e.by].root.position.x, 2.5, .3, '#1d7a55'));
      const h = H[e.by], o = H[1 - e.by];
      await Promise.all([moveTo(e.x, .55), tween(.55, k => { h.ex.z = Math.sin(k * PI) * .45; o.ex.rz = Math.sin(k * PI * 2) * .25; })]);
    }
    else if (e.t === 'miss') { say(`${names[e.by]}の技、${names[1 - e.by]}がこらえた！`); fx(() => say3d('こらえた!', H[1 - e.by].root.position.x, 2.5, .3, '#5b3a9e')); three.shake = .1; await moveTo(e.x, .5); }
    else if (e.t === 'nebari') {
      const h = H[e.by], ex = h.root.position.x;
      three.follow = null; camTo([ex * .8, 1.8, 6.8], [ex, 1.1, 0]);
      say(`${names[e.by]}、土俵際でねばる！`); fx(() => say3d('土俵際!', ex, 2.6, .3, '#cf3f36'));
      h.anim = 'teeter'; h.t = 0;
      await tween(.9, k => { h.ex.rx = -.3 * Math.sin(k * PI); });
      fx(() => sweat(ex, 2.0, .3));
      h.anim = 'push'; follow(.9);
      await moveTo(e.x, .45);
    }
    if (said && e.t !== 'end') await wait(.55);
    else if (e.t === 'end') {
      const W = H[e.winner], L = H[1 - e.winner];
      const dirL = e.winner === 0 ? s : -s; // 負けた側の土俵際の向き
      const lx = L.root.position.x, wx = W.root.position.x, roll = PI * 2.5;
      W.anim = 'idle'; three.follow = null;
      let land = 0;
      if (e.type === 'out') {
        camTo([dirL * 2.2, 3, 9.5], [dirL * 2.6, 1, 0]);
        await tween(.9, k => { L.root.position.x = lerp(lx, dirL * (RING + 1.15), ease(k)); L.ex.rx = -roll * k; L.ex.y = Math.sin(k * PI) * .9 - .16 * k; });
        land = dirL * (RING + 1.15); fx(() => say3d('ドスーン!', land, 2.4, .3, '#cf3f36'));
      } else if (e.type === 'throw') {
        camTo([wx * .6, 3.6, 9.6], [wx, 1.1, .8]);
        await tween(1.0, k => { W.root.rotation.y = (e.winner === 0 ? s : -s) * PI / 2 + k * PI * 2; L.root.position.z = lerp(0, 2.3, ease(k)); L.root.position.x = lerp(lx, wx, ease(k)); L.ex.rz = roll * k; L.ex.y = Math.sin(k * PI) * 1.3 - .1 * k; });
        land = wx; fx(() => say3d('ズドン!', wx, 2.4, 2.3, '#cf3f36'));
      } else if (e.type === 'slap') {
        camTo([lx * .7, 2.6, 8.4], [lx, 1, 0]);
        await tween(.7, k => { W.root.position.z = -1.1 * ease(k); L.root.position.x = lerp(lx, lx - dirL * 1.5, ease(k)); L.ex.rx = PI / 2 * ease(k); L.ex.y = -.2 * k; });
        land = lx - dirL * 1.5; fx(() => say3d('ベチャッ', land, 2.0, .3, '#5b3a9e'));
      } else { // うっちゃり
        camTo([wx * .6, 1.8, 7.2], [wx, 1.2, 0]);
        fx(() => say3d('うっちゃり!!', wx, 3.0, .3, '#b9861a'));
        await tween(1.2, k => { W.root.rotation.y = (e.winner === 0 ? s : -s) * PI / 2 + k * PI; W.ex.rx = -.5 * Math.sin(k * PI); L.root.position.x = lerp(lx, -dirL * (RING + 1.15), ease(k)); L.ex.rx = roll * k; L.ex.y = Math.sin(k * PI) * 1.4 - .16 * k; });
        land = -dirL * (RING + 1.15);
      }
      three.shake = .3;
      fx(() => { dustRing(land, L.root.position.z, 10, 1.2); starBurst(land, 1.4, L.root.position.z, 6); });
      L.anim = 'down'; W.anim = 'win'; W.ex.rx = 0;
      const wy = W.root.rotation.y;
      // 軍配と勝ち名乗り
      G.pointDir = Math.sign(W.root.position.x - G.root.position.x) || 1; gyoji('gyojiPoint', '勝負あり!');
      camTo([W.root.position.x * .7, 2.9, 9.4], [W.root.position.x, 1.5, 0]);
      await tween(.3, k => { W.root.rotation.y = lerp(wy, 0, k); });
      say(`${e.kimarite}で、${names[e.winner]}の勝ち！`);
      const upset = tiers[1 - e.winner] >= 5 && tiers[e.winner] < tiers[1 - e.winner];
      if (upset) fx(() => { for (let i = 0; i < 16; i++) spawn('zabuton', (Math.random() - .5) * 10, 1 + Math.random(), 6 + Math.random() * 2, { v: [(Math.random() - .5) * 3, 4 + Math.random() * 3, -5 - Math.random() * 3], g: 7, life: 1.6, size: .45, spin: (Math.random() - .5) * 10, fade: .8 }); say3d(tiers[1 - e.winner] === 6 && tiers[e.winner] <= 2 ? '金星!!' : '座布団が舞う!', W.root.position.x, 3.2, .3, '#b9861a'); });
      bigEl.className = 'stage-big' + (e.winner === 0 ? ' win' : '');
      bigEl.innerHTML = `<div class="k">${esc(e.kimarite)}</div><div class="s">${e.winner === 0 ? '白星！' : '黒星…'}</div>`;
      bigEl.hidden = false;
      await wait(1.0);
      L.anim = 'bow'; L.t = 0; L.ex = { rx: 0, rz: 0, y: 0, z: 0 }; L.root.rotation.y = 0;
      await wait(.6);
    }
  }
  three.skip = false;
}

/* ================= 画面 ================= */
const panel = $('#panel');
const meter = (label, v, max, cls = '') => `<div class="meter ${cls}"><span>${label}</span><div class="bar"><i style="width:${clamp(v / max * 100, 0, 100)}%"></i></div><span class="n">${v}</span></div>`;
const starsHtml = marks => marks.map(w => w ? '<span class="w">○</span>' : '●').join('') + '<span class="sub">' + '・'.repeat(Math.max(0, 7 - marks.length)) + '</span>';

function banzukeHtml(showDelta) {
  const cell = r => {
    const d = r.delta, mv = !showDelta ? '' : d > 0 ? `<span class="up">↑${d}</span>` : d < 0 ? `<span class="down">↓${-d}</span>` : '<span class="down">→</span>';
    const wl = showDelta ? `${r.pw}-${r.pl} ${mv}` : `${r.w}-${r.l}`;
    return `<div class="cell${r.me ? ' me' : ''}"><span class="nm">${esc(r.name)}</span><span class="wl">${wl}</span></div>`;
  };
  let h = '<div class="banzuke"><div class="hd">西</div><div class="hd">番付</div><div class="hd">東</div>', lastDiv = '';
  for (let i = 0; i < N; i += 2) {
    const info = rankInfo(i);
    if (info.division !== lastDiv) { lastDiv = info.division; h += `<div class="div">${info.division}</div>`; }
    h += cell(state.roster[i + 1]) + `<div class="rk${info.tier >= 3 ? ' top' : ''}">${info.short}</div>` + cell(state.roster[i]);
  }
  return h + '</div>';
}

function render() {
  logEl = null;
  const ph = state ? state.phase : 'select';
  $('#mastInfo').textContent = state ? `優勝 ${state.yusho}回 ・ 最高位 ${rankInfo(state.best).short}` : '';
  tagEl.hidden = !state || ph === 'banzuke';
  if (state) tagEl.textContent = `${bashoName(state.basho)} ${DAYS[state.day - 1]}`;
  if (ph !== 'result') bigEl.hidden = true;
  if (ph !== 'result' && ph !== 'match') sayEl.textContent = '';
  ({ select: renderSelect, home: renderHome, result: renderResult, banzuke: renderBanzuke })[ph]();
  renderReset();
}
function renderReset() {
  const box = $('#resetBox');

function itemStatus(cat, it) {
  const e = state.equip[cat];
  if (cat === 'wig') { if (!wigUnlocked(it)) return { t: `${it.note}で解禁`, cls: '', locked: true }; return e === it.id ? { t: '着用中', cls: 'on' } : { t: it.note, cls: '' }; }
  if (e === it.id) return { t: '着用中', cls: 'on' };
  if (state.owned[cat].includes(it.id)) return { t: '持っている', cls: '' };
  return { t: `${it.price}粒`, cls: 'price', buy: true };
}
function swatchHtml(cat, it) {
  const m = me();
  if (cat === 'fur') return `<span class="sw" style="background:${hex(it.color ?? kindOf(m.kind).fur)}"></span>`;
  if (cat === 'mawashi') return `<span class="sw belt" style="background:${hex(it.color)}"></span>`;
  if (cat === 'kesho') return it.id === 'none' ? '<span class="sw apron empty"></span>' : `<span class="sw apron" style="background-image:url(${keshoThumb(it.id, m.name)})"></span>`;
  if (it.id === 'auto') return '<span class="sw empty">番</span>';
  if (it.id === 'none') return '<span class="sw empty"></span>';
  return `<span class="sw" style="background:${hex(0x1c1420)};box-shadow:inset 0 0 0 ${it.pins ? 7 : 5}px ${hex(it.tie || 0x1c1420)}"></span>`;
}
function shopHtml() {
  const S = SHOP.find(x => x.cat === (ui.shopCat || 'fur')), P = ui.preview;
  let tryon = '';
  if (P) {
    const it = findIn(SHOP.find(x => x.cat === P.cat).items, P.id), st = itemStatus(P.cat, it);
    const act = st.locked ? `<span class="sub">${it.note}に昇進すると着られます</span>`
      : `<button class="btn primary small" id="buy" ${state.money < it.price ? 'disabled' : ''}>${state.money < it.price ? `あと${it.price - state.money}粒` : `${it.price}粒で買って着る`}</button>`;
    tryon = `<div class="tryon"><span>試着中：<b>${esc(it.name)}</b></span><div class="acts"><button class="btn small" id="untry">もどす</button>${act}</div></div>`;
  }
  return `<div class="card stack">
    <div class="row between"><h2 style="margin:0">着せ替え</h2><span class="purse">ひまわりの種 ${state.money}粒</span></div>
    <div class="cats" role="tablist">${SHOP.map(x => `<button class="cat" role="tab" data-cat="${x.cat}" aria-selected="${x.cat === S.cat}">${x.label}</button>`).join('')}</div>
    <div class="items">${S.items.map(it => { const st = itemStatus(S.cat, it), on = P ? P.cat === S.cat && P.id === it.id : state.equip[S.cat] === it.id;
      return `<button class="item${st.locked ? ' locked' : ''}" data-id="${it.id}" aria-pressed="${on}">${swatchHtml(S.cat, it)}<b>${esc(it.name)}</b><span class="st ${st.cls}">${st.t}</span></button>`; }).join('')}</div>
    ${tryon}
    <p class="sub">${S.cat === 'wig' ? 'カツラは番付が上がるたびに解禁されます。一度解禁したものはいつでも着られます。' : '取組に勝つと懸賞としてひまわりの種がもらえます。持っていないものはタップで試着できます。'}</p>
  </div>`;
}
function bindShop() {
  const cat = ui.shopCat || 'fur', S = SHOP.find(x => x.cat === cat);
  panel.querySelectorAll('.cat').forEach(b => { b.onclick = () => { ui.shopCat = b.dataset.cat; if (ui.preview) { ui.preview = null; showHome(); } render(); }; });
  panel.querySelectorAll('.item').forEach(b => {
    b.onclick = () => {
      const it = findIn(S.items, b.dataset.id), st = itemStatus(cat, it);
      if (st.buy || st.locked) ui.preview = { cat, id: it.id };
      else { ui.preview = null; state.equip[cat] = it.id; save(); }
      showHome(); render();
    };
  });
  const un = $('#untry'); if (un) un.onclick = () => { ui.preview = null; showHome(); render(); };
  const buy = $('#buy');
  if (buy) buy.onclick = () => {
    const P = ui.preview, it = findIn(SHOP.find(x => x.cat === P.cat).items, P.id);
    if (state.money < it.price) return;
    state.money -= it.price; state.owned[P.cat].push(it.id); state.equip[P.cat] = it.id; ui.preview = null; save();
    showHome(); toast(`お買い上げ！ ${it.name}`); render();
  };
}

async function startBout() {
  const m = me(), opp = byId(state.oppId);
  const res = simulateBout(effStats(m.stats, .75 + .25 * state.energy / 100), effStats(opp.stats, .9));
  state.phase = 'match'; ui.tab = 'train'; ui.preview = null;
  panel.innerHTML = `<div class="card stack"><div class="match-head"><h2 style="margin:0">${DAYS[state.day - 1]} 結びの一番</h2><button class="btn small" id="skip">結果まで飛ばす</button></div>
    ${speedHtml()}<ul class="log" id="log" aria-live="polite"></ul></div>`;
  logEl = $('#log'); tagEl.hidden = false; bindSpeed();
  $('#skip').onclick = () => { if (three) three.skip = true; };
  await animateBout(res, m, opp);
  finishBout(res, opp);
  render();
}
function renderResult() {
  const L = ui.last || { win: state.marks[state.marks.length - 1] === 1, kimarite: '', opp: '', oppRank: '' }, m = me();
  panel.innerHTML = whoCard() + `<div class="card stack">
    <div class="verdict ${L.win ? 'win' : ''}">${L.win ? '白星！' : '黒星…'}</div>
    ${L.kimarite ? `<p>決まり手は <b>${esc(L.kimarite)}</b>。${L.win ? '○' : '●'} ${esc(m.name)} ― ${L.win ? '●' : '○'} ${esc(L.opp)}（${L.oppRank}）</p>` : ''}
    ${L.prize ? `<p class="purse">${L.win ? '懸賞' : '出場手当'} +${L.prize}粒</p>` : ''}
  </div><div class="dock"><button class="btn primary wide" id="next">${state.day >= 7 ? '千秋楽おわり。番付発表へ' : '翌日へ'}</button></div>`;
  $('#next').onclick = () => { nextDay(); if (three) showHome(); render(); };
}
function renderBanzuke() {
  const news = ui.news || [];
  panel.innerHTML = `<div class="card stack"><h2>${ui.finished ? esc(ui.finished) + ' おわり' : '場所おわり'}</h2>
    <div class="news">${news.map(n => `<div class="${n.gold ? 'gold' : ''}">${esc(n.t)}</div>`).join('')}</div>
    </div>
  <div class="card stack"><h2>新番付（先場所の成績と昇降）</h2>${banzukeHtml(true)}</div>
  <div class="dock"><button class="btn primary wide" id="nextBasho">${bashoName(state.basho)}へ</button></div>`;
  if (three) { showHome(); if (three.solo) three.solo.anim = 'win'; }
  $('#nextBasho').onclick = () => { state.phase = 'home'; state.roster.forEach(r => { r.delta = 0; }); save(); if (three) showHome(); render(); };
}

/* ================= 起動 ================= */
window.__sumo = { simulateBout, rankInfo, get state() { return state; }, render: () => { if (three && state) showHome(); render(); } };
function boot() {
  three = initThree(); if (three) three.speed = speedV();
  if (!three) sayEl.textContent = '3D表示を使えない環境です。文字だけで進行します。';
  state = load();
  if (state) { if (state.phase === 'match') state.phase = 'home'; showHome(); }
  else showSolo(selectLook(), 'select');
  render();
}
boot();
})();
</script>

</body>
